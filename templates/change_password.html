{% extends 'base.html' %}
{% block content %}
<div class="card p-4" style="max-width: 620px;">
    <h4 class="mb-4">Ubah Password</h4>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label class="form-label" for="current_password">Password saat ini</label>
            <div class="input-group">
                <input class="form-control" id="current_password" type="password" name="current_password" autocomplete="current-password" required>
                <button class="btn btn-outline-secondary" type="button" aria-label="Tampilkan password" title="Tampilkan password" onclick="togglePasswordVisibility('current_password', this)">
                    <svg class="password-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="password-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg>
                </button>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="new_password">Password baru</label>
            <div class="input-group">
                <input class="form-control" id="new_password" type="password" name="new_password" minlength="12" autocomplete="new-password" required>
                <button class="btn btn-outline-secondary" type="button" aria-label="Tampilkan password" title="Tampilkan password" onclick="togglePasswordVisibility('new_password', this)">
                    <svg class="password-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="password-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg>
                </button>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="confirm_password">Konfirmasi password baru</label>
            <div class="input-group">
                <input class="form-control" id="confirm_password" type="password" name="confirm_password" minlength="12" autocomplete="new-password" required>
                <button class="btn btn-outline-secondary" type="button" aria-label="Tampilkan password" title="Tampilkan password" onclick="togglePasswordVisibility('confirm_password', this)">
                    <svg class="password-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="password-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg>
                </button>
            </div>
        </div>
        <button class="btn btn-primary" type="submit">Simpan Password</button>
    </form>
</div>
{% endblock %}
